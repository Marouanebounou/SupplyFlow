<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Produits - SupplyFlow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        a.add-btn {
            display: inline-block;
            margin-bottom: 20px;
            background: #4a90d9;
            color: #fff;
            padding: 9px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
        }

        a.add-btn:hover {
            background: #357abd;
        }

        table {
            width: 100%;
            max-width: 900px;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        thead {
            background: #4a90d9;
            color: #fff;
        }

        thead th {
            padding: 12px 16px;
            text-align: left;
            font-size: 14px;
            font-weight: normal;
        }

        tbody tr {
            border-bottom: 1px solid #eee;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #f0f7ff;
        }

        tbody td {
            padding: 11px 16px;
            font-size: 14px;
            color: #444;
        }

        a.edit {
            color: #4a90d9;
            text-decoration: none;
        }

        a.edit:hover {
            text-decoration: underline;
        }

        a.delete {
            color: #e05555;
            text-decoration: none;
        }

        a.delete:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>Inventaire des Produits</h1>

<a th:href="@{/produits/new}" class="add-btn">+ Ajouter un nouveau produit</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Catégorie</th>
        <th>Prix</th>
        <th>Quantité en Stock</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="produit : ${produits}">
        <td th:text="${produit.id}"></td>
        <td th:text="${produit.name}"></td>
        <td th:text="${produit.category}"></td>
        <td th:text="${produit.price} + ' MAD'"></td>
        <td th:text="${produit.quantity}"></td>
        <td>
            <a class="edit" th:href="@{/produits/update/{id}(id=${produit.id})}">Modifier</a> |
            <a class="delete" th:href="@{/produits/delete/{id}(id=${produit.id})}"
               onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce produit ?');">
                Supprimer
            </a>
        </td>
    </tr>
    </tbody>
</table>
<a th:href="@{/}" class="back">← Retour au Tableau de Bord</a>
</body>
</html>
