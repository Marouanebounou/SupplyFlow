<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Enregistrer un Mouvement - SupplyFlow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }

        h1 {
            color: #333;
            margin-bottom: 24px;
        }

        .error {
            color: #e05555;
            background: #fdecea;
            border: 1px solid #f5c6c6;
            padding: 10px 14px;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 20px;
            max-width: 400px;
        }

        form {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            max-width: 400px;
            border: 1px solid #ddd;
        }

        label {
            font-size: 14px;
            color: #555;
        }

        select,
        input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
        }

        select:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #4a90d9;
        }

        div {
            margin-bottom: 16px;
        }

        button[type="submit"] {
            background: #4a90d9;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
        }

        button[type="submit"]:hover {
            background: #357abd;
        }

        a {
            display: inline-block;
            margin-top: 16px;
            color: #4a90d9;
            font-size: 14px;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>Nouveau Mouvement de Stock</h1>

<div th:if="${erreur}" th:text="${erreur}" class="error"></div>

<form th:action="@{/stockMovement/save}" method="post">

    <div>
        <label>Produit :</label>
        <select name="produitId" required>
            <option value="" disabled selected>-- Sélectionnez un produit --</option>
            <option th:each="p : ${produits}" th:value="${p.id}" th:text="${p.name + ' (Stock: ' + p.quantity + ')'}"></option>
        </select>
    </div>

    <div>
        <label>Type de Mouvement :</label>
        <select name="type" required>
            <option value="ENTREE">Entrée (Réception)</option>
            <option value="SORTIE">Sortie (Expédition)</option>
        </select>
    </div>

    <div>
        <label>Quantité :</label>
        <input type="number" name="quantite" min="1" required />
    </div>

    <button type="submit">Enregistrer</button>

</form>

<a th:href="@{/stockMovement}">← Annuler et voir l'historique</a>

</body>
</html>
