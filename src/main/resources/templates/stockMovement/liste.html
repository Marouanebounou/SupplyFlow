<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historique des Mouvements - SupplyFlow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        a.add-btn {
            display: inline-block;
            margin-bottom: 20px;
            background: #4a90d9;
            color: #fff;
            padding: 9px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
        }

        a.add-btn:hover {
            background: #357abd;
        }

        table {
            width: 100%;
            max-width: 800px;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        thead {
            background: #4a90d9;
            color: #fff;
        }

        thead th {
            padding: 12px 16px;
            text-align: left;
            font-size: 14px;
            font-weight: normal;
        }

        tbody tr {
            border-bottom: 1px solid #eee;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #f0f7ff;
        }

        tbody td {
            padding: 11px 16px;
            font-size: 14px;
            color: #444;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 13px;
        }

        .badge.entree {
            background: #e6f4ea;
            color: #2e7d32;
        }

        .badge.sortie {
            background: #fdecea;
            color: #c62828;
        }

        a.back {
            display: inline-block;
            margin-top: 20px;
            color: #4a90d9;
            font-size: 14px;
            text-decoration: none;
        }

        a.back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>Historique des Mouvements de Stock</h1>

<a th:href="@{/stockMovement/new}" class="add-btn">+ Enregistrer une entrée / sortie</a>

<table>
    <thead>
    <tr>
        <th>Date et Heure</th>
        <th>Produit</th>
        <th>Type</th>
        <th>Quantité</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="mouvement : ${mouvements}">
        <td th:text="${#temporals.format(mouvement.date, 'dd-MM-yyyy HH:mm')}"></td>
        <td th:text="${mouvement.produit.name}"></td>
        <td>
            <span class="badge entree" th:if="${mouvement.type == 'ENTREE'}">Entrée</span>
            <span class="badge sortie" th:if="${mouvement.type == 'SORTIE'}">Sortie</span>
        </td>
        <td th:text="${mouvement.quantity}"></td>
    </tr>
    </tbody>
</table>

<a th:href="@{/}" class="back">← Retour au Tableau de Bord</a>

</body>
</html>
